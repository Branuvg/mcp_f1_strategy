[project]
name = "mcp-f1-strategy"
version = "0.1.0"
description = "F1 pit-stop strategy MCP server (undercut/overcut, degradation modeling) — CC3067 Redes Project 1"
authors = [
    { name = "Gabriel Bran", email = "gabrielbranb@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4.0",
    "numpy>=1.26.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
